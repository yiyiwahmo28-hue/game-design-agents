name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared engines and the first-run tools
        run: npm test
      - name: Compare Rain Harbor against the independent rule oracle
        run: npm run audit
      - name: Check evidence for both original cases
        run: npm run verify
